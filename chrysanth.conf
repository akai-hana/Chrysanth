# =!=>||> chrysanth.conf :=<~>!= #
# Configure Chrysanth's parameters

# Install system-wide with `make install`, or leave next to binary.

# ---

# Rendering settings
shader = ~/git/chrysanth/shaders/milk-bag/iso.frag # .frag file, or dir/ for randomized selection.
speed  = 1
scale  = 1 # 0.5 = half-resolution
fps   = 33 # default: your monitor's hz (xrandr) 

# Windows that won't pause the shader (e.g. transparent terminals). [-k]
fullscreen_pause_exceptions = ghostty

# Windows that kill the compositor, and re-open it on fullscreen exit
# (e.g. Videogames, where performance/latency matters). [-K]
fullscreen_kill_compositor = java, Minecraft, "FTB StoneBlock 4", ULTRAKILL, TaterClient-DDNet, osu-lazer
# (Entries should match the window's WM_CLASS/WM_NAME attribute.)

# Runs shell command immediately at startup (e.g. a compositor). [-C]
compositor = DRI_PRIME=0 nice -n -20 picom # dedicated gpu and highest nice prio
# (A compositor can affect the entire desktop's snappiness, so it is worth prioritizing it.)

# Wrap Chrysanth with any shell commands. Only affects Chrysanth, not the compositor. [-W]
wrapper = DRI_PRIME=1 nice -n 19 # integrated gpu and lowest nice prio
# (Can be delegated to an integrated gpu, to avoid the shader hogging up resources.)
